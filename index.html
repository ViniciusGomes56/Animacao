
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacao</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="jogo">

        <!-- Cenario -->
        <div class="cenario">
            <img src="cenario.png" id="imagemCenario">
        </div>

        <!-- Personagem -->
        <div class="personagem" id="personagem">

            <!-- Personagem parado -->
            <img src="selectScreen.png" class="parado">

            <!-- Animacao andando -->
            <div class="andando">
                <img src="flying1.png">
                <img src="flying2.png">
                <img src="flying3.png">
                
            </div>

            <!-- Animacao especial -->
            <div class="especial">
                <img src="counter down1.png">
                <img src="counter down2.png">
                <img src="counter down3.png">
                <img src="counter down4.png">
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
